name: Cold search index profiling

on:
  push:
    branches: ['perf/workspace-setup-github-actions']
    paths:
      - 'tests/profile_search_index.py'
      - 'tests/v3_index_profile_test.py'
      - '.github/workflows/search-index-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    name: Cold index / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
          - os: windows-latest
            python: '3.11'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      BEYIN_V3_NO_SPAWN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify profiling phase boundaries and instrumentation cleanup
        run: python -m unittest discover -s tests -p "v3_index_profile_test.py"
      - name: Profile frozen cold index three times, unchanged production path
        run: python tests/profile_search_index.py --repeats 3
      - name: Run original benchmark performance and recall contracts
        run: python -m unittest discover -s tests -p "v3_search_benchmark_test.py"
