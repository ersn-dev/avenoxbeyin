name: Bounded Windows and Ubuntu IO diagnosis

on:
  push:
    branches: ['diag/windows-io-cost-20261020']
    paths:
      - 'tests/profile_windows_io.py'
      - '.github/workflows/windows-io-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  io-profile:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      BEYIN_V3_NO_SPAWN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Measure real IO primitives and three unchanged tests twice
        run: python tests/profile_windows_io.py --repeats 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-io-profile-${{ matrix.os }}
          path: windows-io-profile.jsonl
          if-no-files-found: error
          retention-days: 14
