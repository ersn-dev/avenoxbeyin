name: Workspace setup performance (manual diagnostic)

on:
  push:
    branches: ['perf/workspace-setup-github-actions']
    paths:
      - '.github/workflows/workspace-setup-profile.yml'
      - 'tests/workspace_setup_profile.py'
      - 'tests/v3_workspace_onboarding_test.py'
      - 'template/.claude/scripts/beyin_v3_workspace_context.py'
      - 'template/.claude/scripts/beyin_v3_workspace_views.py'
      - 'template/.claude/scripts/beyin_v3_workspace_onboarding.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      BEYIN_V3_NO_SPAWN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Focused onboarding and authorization regression tests
        run: python -m unittest discover -s tests -p "v3_workspace_onboarding_test.py"
      - name: Profile real onboarding with synthetic vaults
        run: python tests/workspace_setup_profile.py --sizes 0,100 --jsonl workspace-profile.jsonl
      - name: Upload measurements even if profiling fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-profile-${{ matrix.os }}-py${{ matrix.python }}
          path: workspace-profile.jsonl
          if-no-files-found: warn
          retention-days: 14
